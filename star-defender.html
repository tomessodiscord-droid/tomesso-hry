<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>Star Defender</title>
<style>
html,body{margin:0;height:100%;background:#03050d;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#050816;box-shadow:0 0 60px #0a1a4a88}
</style></head><body><canvas id="c"></canvas>
<script>
'use strict';
const W=480,H=800,cv=document.getElementById('c'),ctx=cv.getContext('2d');
let sc=1;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);sc=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*sc+'px';cv.style.height=H*sc+'px';cv.width=Math.round(W*sc*dpr);cv.height=Math.round(H*sc*dpr);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
addEventListener('resize',resize);resize();
const R=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>x<a?a:x>b?b:x,TAU=Math.PI*2;
let hi=0;try{hi=+localStorage.getItem('stardef_hi')||0}catch(e){}
/* ---------- zvuk ---------- */
let ac=null,mute=false;
function initAudio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(ac&&ac.state==='suspended')ac.resume();}
function tone(f1,f2,d,type,v){if(!ac||mute)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);}
let nbuf=null;function noise(d,v){if(!ac||mute)return;if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
 const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nbuf;f.type='lowpass';f.frequency.setValueAtTime(1800,t);f.frequency.exponentialRampToValueAtTime(120,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t,Math.random(),d+.05);}
const sfx={shoot:()=>tone(900,500,.06,'square',.025),boom:()=>noise(.35,.25),big:()=>noise(.8,.4),hit:()=>tone(200,60,.15,'sawtooth',.1),
 power:()=>{tone(500,900,.1,'triangle',.12);setTimeout(()=>tone(700,1300,.12,'triangle',.12),90)},bomb:()=>{noise(1,.5);tone(150,30,.8,'sawtooth',.15)},wave:()=>{tone(300,600,.2,'triangle',.1);setTimeout(()=>tone(450,900,.25,'triangle',.1),150)},over:()=>{tone(400,60,1.2,'sawtooth',.14)}};
/* ---------- stav ---------- */
let state='menu',paused=false,t=0,shake=0,flash=0;
let score,lives,wave,combo,comboT,spawnQ,spawnT,waveBanner,boss;
let P,bullets,eb,enemies,pups,parts,stars=[],texts=[];
for(let i=0;i<90;i++)stars.push({x:R(0,W),y:R(0,H),z:R(.2,1)});
function reset(){score=0;lives=3;wave=0;combo=1;comboT=0;spawnQ=[];spawnT=0;waveBanner=0;boss=null;bullets=[];eb=[];enemies=[];pups=[];parts=[];texts=[];
 P={x:W/2,y:H-130,tx:W/2,ty:H-130,lvl:1,shield:0,inv:1.5,fire:0,bombs:0,r:14,dead:0};nextWave();}
function nextWave(){wave++;waveBanner=2.2;sfx.wave();spawnQ=[];
 if(wave%5===0){spawnQ.push({t:1.5,type:'boss'});}
 else{const n=8+wave*3,pats=['row','v','sine','side'];const kinds=['drone'];if(wave>=2)kinds.push('zig','zig');if(wave>=2)kinds.push('tank');if(wave>=3)kinds.push('kami','kami');
  let time=1;for(let i=0;i<Math.ceil(n/5);i++){const pat=pats[(wave+i)%4],kind=kinds[Math.floor(Math.random()*kinds.length)];spawnQ.push({t:time,type:'group',pat,kind,n:Math.min(9,4+Math.floor(wave/2))});time+=R(1.3,2.3);}}}
function mk(kind,x,y,extra){const d={drone:{hp:1,r:14,sp:110,pts:100,col:'#ff4d6d'},zig:{hp:2,r:15,sp:90,pts:200,col:'#ffb300'},tank:{hp:6,r:20,sp:55,pts:400,col:'#b06bff'},kami:{hp:2,r:12,sp:0,pts:150,col:'#ff7a1a'}}[kind];
 const dif=1+Math.min(1.3,wave*.07),hpx=d.hp+Math.floor(wave/3);
 const e=Object.assign({kind,x,y,x0:x,hp:hpx,max:hpx,r:d.r,sp:d.sp*dif,pts:d.pts,col:d.col,t:0,fire:R(1,3),hit:0},extra||{});enemies.push(e);return e;}
function spawnGroup(g){const n=g.n;for(let i=0;i<n;i++){let x,y=-30,ex={};
  if(g.pat==='row'){x=W*(i+1)/(n+1);y=-30-i*0;}
  else if(g.pat==='v'){x=W/2+(i-(n-1)/2)*50;y=-30-Math.abs(i-(n-1)/2)*40;}
  else if(g.pat==='sine'){x=W/2;y=-30-i*55;ex.sine=1;}
  else{x=i%2?-30:W+30;y=60+i*45;ex.side=i%2?1:-1;}
  const e=mk(g.kind,x,y,ex);if(g.kind==='kami'){e.dive=0;e.sp=0;}}}
function spawnBoss(){boss=mk('tank',W/2,-80,{boss:1,hp:110+wave*26,r:46,pts:5000,col:'#ff2fd0',sp:40});boss.max=boss.hp;boss.fire=1;boss.ph=0;}
/* ---------- vstup ---------- */
const keys={};let ptr=null,off={x:0,y:-70};
addEventListener('keydown',e=>{keys[e.code]=1;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();initAudio();
 if(e.code==='KeyB')bomb();if(e.code==='KeyM')mute=!mute;if(e.code==='KeyP')paused=!paused;if((e.code==='Enter'||e.code==='Space')&&state!=='play')start();});
addEventListener('keyup',e=>{keys[e.code]=0});
const toLocal=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}};
const BTN={x:W-56,y:H-56,r:34},PB={x:W-34,y:34,r:20};
cv.addEventListener('pointerdown',e=>{initAudio();const p=toLocal(e);e.preventDefault();
 if(state!=='play'){if(state==='menu'||t-overT>1)start();return}
 if(Math.hypot(p.x-PB.x,p.y-PB.y)<PB.r+10){paused=!paused;return}
 if(paused){paused=false;return}
 if(Math.hypot(p.x-BTN.x,p.y-BTN.y)<BTN.r+14){bomb();return}
 if(ptr==null){ptr=e.pointerId;off.x=P.x-p.x;off.y=P.y-p.y;if(e.pointerType==='touch'){off.y=-70;off.x=0}else{off.x=0;off.y=0}try{cv.setPointerCapture(e.pointerId)}catch(_){}}});
cv.addEventListener('pointermove',e=>{if(e.pointerId===ptr&&state==='play'){const p=toLocal(e);P.tx=p.x+off.x;P.ty=p.y+off.y;}});
for(const ev of['pointerup','pointercancel'])cv.addEventListener(ev,e=>{if(e.pointerId===ptr)ptr=null});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')paused=true});
let overT=0;
function start(){reset();state='play';paused=false;}
function bomb(){if(state!=='play'||P.bombs<=0||paused)return;P.bombs--;sfx.bomb();flash=1;shake=14;eb.length=0;
 for(const e of enemies){if(e.boss){e.hp-=25;e.hit=.1}else{e.hp=0;}}
 for(let i=0;i<60;i++)part(P.x,P.y,R(0,TAU),R(150,600),'#9fd8ff',R(.4,1));}
/* ---------- pomocné ---------- */
function part(x,y,a,s,col,life,size){parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,col,size:size||R(1.5,3.5)});}
function boom(x,y,col,n,big){for(let i=0;i<n;i++)part(x,y,R(0,TAU),R(40,big?380:240),i%3?col:'#fff',R(.3,big?1.1:.7));if(big){shake=Math.max(shake,12);sfx.big()}else sfx.boom();}
function addText(x,y,s,col){texts.push({x,y,s,col,life:.9});}
function drop(x,y){const r=Math.random();let k=null;if(r<.04)k='W';else if(r<.06)k='S';else if(r<.08)k='B';else if(r<.09)k='H';if(k)pups.push({x,y,k,t:0});}
function killEnemy(e,byBomb){e.dead=1;combo=Math.min(8,combo+(byBomb?0:1));comboT=2.2;const p=e.pts*combo;score+=p;if(score>hi){hi=score;try{localStorage.setItem('stardef_hi',hi)}catch(_){}}
 boom(e.x,e.y,e.col,e.boss?80:e.kind==='tank'?26:14,!!e.boss||e.kind==='tank');addText(e.x,e.y-10,'+'+p,e.boss?'#ff9af0':'#fff');drop(e.x,e.y);
 if(e.boss){boss=null;for(let i=0;i<3;i++)pups.push({x:e.x+R(-50,50),y:e.y+R(-30,30),k:['W','B','S'][i],t:0});}}
function hurt(){if(P.inv>0)return;if(P.shield>0){P.shield=0;P.inv=1.2;sfx.hit();shake=8;boom(P.x,P.y,'#6fe3ff',20);return}
 lives--;P.inv=1.6;P.lvl=Math.max(1,P.lvl-2);combo=1;shake=18;flash=.6;sfx.hit();boom(P.x,P.y,'#ff6a6a',40,true);
 if(lives<=0){state='over';overT=t;sfx.over();P.dead=1;}}
/* ---------- aktualizace ---------- */
function shoot(){const l=P.lvl,y=P.y-18,add=(dx,vx,dmg)=>bullets.push({x:P.x+dx,y,vx,vy:-760,dmg:dmg||1});
 if(l===1)add(0,0);else if(l===2){add(-9,0);add(9,0);}else if(l===3){add(0,0,1.3);add(-12,-70);add(12,70);}
 else if(l===4){add(-8,0);add(8,0);add(-18,-130);add(18,130);}else{add(0,0,1.5);add(-10,-60);add(10,60);add(-20,-170);add(20,170);}
 sfx.shoot();}
function update(dt){
 t+=dt;for(const s of stars){s.y+=s.z*70*dt*(1+wave*.03);if(s.y>H){s.y=-2;s.x=R(0,W)}}
 if(state==='menu'||paused)return;
 shake*=Math.exp(-7*dt);flash=Math.max(0,flash-dt*2);
 // hráč
 if(state==='play'){let dx=0,dy=0;if(keys.ArrowLeft||keys.KeyA)dx-=1;if(keys.ArrowRight||keys.KeyD)dx+=1;if(keys.ArrowUp||keys.KeyW)dy-=1;if(keys.ArrowDown||keys.KeyS)dy+=1;
  if(dx||dy){P.tx=clamp(P.x+dx*420*dt*3,20,W-20);P.ty=clamp(P.y+dy*420*dt*3,H*.35,H-50);}
  if(window.__bot&&enemies.length){let b=null,bd=1e9;for(const e of enemies){if(e.y>0&&e.y<P.y){const d=Math.abs(e.x-P.x)+ (P.y-e.y)*0.3;if(d<bd){bd=d;b=e}}}if(b)P.tx=b.x;P.ty=H-130;
   for(const q of eb)if(Math.abs(q.x-P.x)<40&&q.y>P.y-160&&q.y<P.y){P.tx=P.x+(q.x<P.x?80:-80);break;}if(P.bombs>0&&enemies.length>9)bomb();}
  P.tx=clamp(P.tx,16,W-16);P.ty=clamp(P.ty,H*.3,H-44);const k=1-Math.exp(-18*dt);P.x+=(P.tx-P.x)*k;P.y+=(P.ty-P.y)*k;
  P.inv=Math.max(0,P.inv-dt);P.shield=Math.max(0,P.shield-dt);P.fire-=dt;if(P.fire<=0){shoot();P.fire=.15-Math.min(.05,P.lvl*.008);}}
 comboT-=dt;if(comboT<=0)combo=1;
 // spawner
 if(state==='play'){spawnT+=dt;waveBanner=Math.max(0,waveBanner-dt);
  for(let i=spawnQ.length-1;i>=0;i--){if(spawnT>=spawnQ[i].t){const q=spawnQ.splice(i,1)[0];if(q.type==='boss')spawnBoss();else spawnGroup(q);}}
  if(!spawnQ.length&&enemies.length<=1&&spawnT>1.5){spawnT=0;nextWave();}}
 if(!spawnQ.length&&!enemies.length&&state==='play'&&spawnT===0){}
 // kulky
 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;}bullets=bullets.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20&&!b.dead);
 for(const b of eb){b.x+=b.vx*dt;b.y+=b.vy*dt;}eb=eb.filter(b=>b.y<H+20&&b.y>-40&&b.x>-30&&b.x<W+30);
 // nepřátelé
 for(const e of enemies){e.t+=dt;e.hit=Math.max(0,e.hit-dt);
  if(e.boss){if(e.y<130)e.y+=60*dt;else{e.x=W/2+Math.sin(e.t*.7)*150;e.y=130+Math.sin(e.t*1.3)*14;}
   e.fire-=dt;if(e.fire<=0&&e.y>=120){e.ph++;if(e.ph%3===0){const n=18+Math.min(14,wave);for(let i=0;i<n;i++){const a=i/n*TAU+e.t;eb.push({x:e.x,y:e.y,vx:Math.cos(a)*190,vy:Math.sin(a)*190,r:5});}e.fire=1.1;if(e.ph%6===0){for(let k=0;k<3;k++)mk('kami',e.x+(k-1)*50,e.y+40);}}
    else{const a=Math.atan2(P.y-e.y,P.x-e.x);for(let i=-2;i<=2;i++){eb.push({x:e.x,y:e.y+20,vx:Math.cos(a+i*.2)*280,vy:Math.sin(a+i*.2)*280,r:5});}e.fire=.7;}}}
  else if(e.kind==='drone'){e.y+=e.sp*dt;if(e.sine)e.x=e.x0+Math.sin(e.t*2.4+e.y*.01)*120;if(e.side){e.x+=e.side*-130*dt;e.y+=20*dt;}}
  else if(e.kind==='zig'){e.y+=e.sp*dt;e.x=e.x0+Math.sin(e.t*3)*90;e.fire-=dt;if(e.fire<=0&&wave>=2&&e.y>0&&e.y<H*.65){const a=Math.atan2(P.y-e.y,P.x-e.x),v=250+wave*6;eb.push({x:e.x,y:e.y,vx:Math.cos(a)*v*.5,vy:Math.max(120,Math.sin(a)*v),r:5});e.fire=R(1,2.1);}}
  else if(e.kind==='tank'){e.y+=e.sp*dt;e.fire-=dt;if(e.fire<=0&&e.y>0&&e.y<H*.55){const a=Math.atan2(P.y-e.y,P.x-e.x);const v=220+wave*6;for(let i=-2;i<=2;i++)eb.push({x:e.x,y:e.y+14,vx:Math.cos(a+i*.2)*v,vy:Math.sin(a+i*.2)*v,r:5});e.fire=R(1.4,2.4);}}
  else if(e.kind==='kami'){if(e.y<60+e.t*0){e.y+=140*dt;}else if(!e.dive){e.dive=1;const a=Math.atan2(P.y-e.y,P.x-e.x);e.vx=Math.cos(a)*(400+wave*8);e.vy=Math.sin(a)*(400+wave*8);}else{e.x+=e.vx*dt;e.y+=e.vy*dt;}}
  if(e.y>H+60||e.x<-80||e.x>W+80){e.gone=1;}
  // zásah kulkou
  for(const b of bullets){if(b.dead||e.gone||e.dead)continue;const dx=b.x-e.x,dy=b.y-e.y,rr=e.r+5;if(dx*dx+dy*dy<rr*rr){b.dead=1;e.hp-=b.dmg;e.hit=.08;part(b.x,b.y,R(0,TAU),R(40,140),e.col,.25);if(e.hp<=0)killEnemy(e);}}
  // náraz do hráče
  if(state==='play'&&!e.dead&&!e.gone){const dx=P.x-e.x,dy=P.y-e.y,rr=e.r+P.r-4;if(dx*dx+dy*dy<rr*rr){hurt();if(!e.boss){e.hp=0;killEnemy(e,true);}}}}
 enemies=enemies.filter(e=>!e.dead&&!e.gone);
 // nepřátelské střely
 if(state==='play')for(const b of eb){const dx=P.x-b.x,dy=P.y-b.y,rr=b.r+P.r-6;if(dx*dx+dy*dy<rr*rr){b.y=H+100;hurt();}}
 // bonusy
 for(const p of pups){p.t+=dt;p.y+=70*dt;p.x+=Math.sin(p.t*3)*20*dt;if(state==='play'&&Math.hypot(P.x-p.x,P.y-p.y)<30){p.got=1;sfx.power();
  if(p.k==='W'){if(P.lvl<5)P.lvl++;else score+=500;addText(p.x,p.y,'ZBRAŇ '+P.lvl,'#ffd54a');}else if(p.k==='S'){P.shield=6;addText(p.x,p.y,'ŠTÍT','#6fe3ff');}else if(p.k==='B'){P.bombs=Math.min(5,P.bombs+1);addText(p.x,p.y,'+BOMBA','#ff8a8a');}else{lives=Math.min(5,lives+1);addText(p.x,p.y,'+ŽIVOT','#7dff8a');}}}
 pups=pups.filter(p=>!p.got&&p.y<H+30);
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;p.life-=dt;}parts=parts.filter(p=>p.life>0);
 for(const x of texts){x.y-=40*dt;x.life-=dt;}texts=texts.filter(x=>x.life>0);
 // plamen motoru
 if(state==='play'&&Math.random()<.6)part(P.x+R(-4,4),P.y+16,Math.PI/2,R(80,200),Math.random()<.5?'#6fd6ff':'#fff',R(.15,.3),2);}
/* ---------- kreslení ---------- */
function glow(x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalAlpha=1;}
function shipP(x,y,flick){ctx.save();ctx.translate(x,y);if(flick)ctx.globalAlpha=.4+.4*Math.sin(t*40);
 ctx.fillStyle='#1b2a5a';ctx.strokeStyle='#6fe3ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(8,-4);ctx.lineTo(24,12);ctx.lineTo(22,18);ctx.lineTo(9,13);ctx.lineTo(0,18);ctx.lineTo(-9,13);ctx.lineTo(-22,18);ctx.lineTo(-24,12);ctx.lineTo(-8,-4);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle='#6fe3ff';ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(4,0);ctx.lineTo(-4,0);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#ff6ad5';ctx.beginPath();ctx.moveTo(-14,8);ctx.lineTo(-18,14);ctx.moveTo(14,8);ctx.lineTo(18,14);ctx.stroke();ctx.restore();}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);const hit=e.hit>0;ctx.fillStyle=hit?'#fff':'#14172e';ctx.strokeStyle=hit?'#fff':e.col;ctx.lineWidth=2;
 if(e.boss){ctx.scale(2.2,2.2);ctx.beginPath();ctx.moveTo(0,22);ctx.lineTo(14,6);ctx.lineTo(24,-6);ctx.lineTo(18,-14);ctx.lineTo(6,-8);ctx.lineTo(0,-16);ctx.lineTo(-6,-8);ctx.lineTo(-18,-14);ctx.lineTo(-24,-6);ctx.lineTo(-14,6);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=hit?'#fff':e.col;ctx.beginPath();ctx.arc(0,0,5+Math.sin(t*6)*1.5,0,TAU);ctx.fill();}
 else if(e.kind==='drone'){ctx.beginPath();ctx.moveTo(0,14);ctx.lineTo(13,-8);ctx.lineTo(0,-3);ctx.lineTo(-13,-8);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=e.col;ctx.fillRect(-2,-2,4,5);}
 else if(e.kind==='zig'){ctx.beginPath();ctx.moveTo(0,15);ctx.lineTo(15,0);ctx.lineTo(8,-12);ctx.lineTo(-8,-12);ctx.lineTo(-15,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(0,0,4,0,TAU);ctx.fill();}
 else if(e.kind==='tank'){ctx.beginPath();for(let i=0;i<6;i++){const a=i/6*TAU+Math.PI/6;ctx.lineTo(Math.cos(a)*21,Math.sin(a)*21);}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=e.col;ctx.fillRect(-4,2,8,16);ctx.beginPath();ctx.arc(0,0,6,0,TAU);ctx.fill();}
 else{ctx.rotate(Math.atan2(e.vy||1,e.vx||0)-Math.PI/2);ctx.beginPath();ctx.moveTo(0,14);ctx.lineTo(10,-10);ctx.lineTo(0,-5);ctx.lineTo(-10,-10);ctx.closePath();ctx.fill();ctx.stroke();}
 ctx.restore();
 if(e.max>1&&!e.boss){ctx.fillStyle='#0008';ctx.fillRect(e.x-16,e.y-e.r-9,32,4);ctx.fillStyle=e.col;ctx.fillRect(e.x-16,e.y-e.r-9,32*e.hp/e.max,4);}}
function draw(){
 const sx=shake?R(-shake,shake):0,sy=shake?R(-shake,shake):0;
 ctx.save();ctx.translate(sx,sy);
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#04061a');bg.addColorStop(1,'#0c1440');ctx.fillStyle=bg;ctx.fillRect(-20,-20,W+40,H+40);
 glow(W*.75,H*.25,260,'#3a1a6a',.45);glow(W*.2,H*.7,300,'#0f3a6a',.4);
 for(const s of stars){ctx.fillStyle='rgba(255,255,255,'+(.25+s.z*.6)+')';const z=s.z*1.8;ctx.fillRect(s.x,s.y,z,z*(1+s.z*2));}
 ctx.globalCompositeOperation='lighter';

  ctx.fillStyle='#ffd54a';ctx.font='18px Arial';ctx.fillText((score>=hi&&score>0?'★ NOVÝ REKORD ★':'Rekord '+hi.toLocaleString('cs'))+'  ·  vlna '+wave,W/2,H*.48);
  if(t-overT>1){ctx.fillStyle='rgba(255,179,0,'+(.6+.4*Math.sin(t*5))+')';ctx.font='bold 22px Arial';ctx.fillText('klepni pro novou hru',W/2,H*.6);}}}}
