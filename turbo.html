<style>

.st{display:flex;align-items:center;gap:6px;font-size:10px;color:#9fb3d1;margin:2px 0}.st span{width:62px}.st i{flex:1;height:5px;background:#243047;border-radius:3px;overflow:hidden}.st i b{display:block;height:100%;background:linear-gradient(90deg,#ff9100,#ffd54a)}
#pPaint{position:absolute;right:12px;top:6px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}

<script>'use strict';
/* ===== Turbo Garage – čistá logika (bez grafiky, testovatelná v Node) ===== */
const TG=(function(){
const TAU=Math.PI*2,clamp=(x,a,b)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t;
const wrapPI=a=>{a%=TAU;if(a>Math.PI)a-=TAU;else if(a<-Math.PI)a+=TAU;return a};
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const ASPH=9,KERB=1.2,WALL=16.7;

/* ---------- auta ---------- */
const BRANDS=["Vesta","Zorin","Kappa","Drako","Mirra","Volta","Nexa"];
const MODELS=["Mini","Lite","City","Sprint","Rapid","Turbo","Storm","Blaze","Apex","Ultra"];
const CLASS_NAMES=["Městské","Hot hatch","Sport","Muscle GT","GT","Supercar","Hypercar"];
const CLS=[ // rozměry a tvar karoserie
{L:3.80,W:1.74,roof:1.42,belt:.88,deck:.94,hood:.80,nose:.58,c0:.16,c1:.70,wing:0,R:.31,tw:.20},
{L:3.95,W:1.78,roof:1.40,belt:.88,deck:.95,hood:.80,nose:.56,c0:.18,c1:.70,wing:1,R:.33,tw:.22},
{L:4.30,W:1.82,roof:1.32,belt:.86,deck:.92,hood:.78,nose:.54,c0:.24,c1:.68,wing:1,R:.34,tw:.23},
{L:4.55,W:1.88,roof:1.30,belt:.88,deck:.95,hood:.82,nose:.55,c0:.28,c1:.66,wing:1,R:.35,tw:.25},
{L:4.50,W:1.92,roof:1.20,belt:.82,deck:.88,hood:.72,nose:.46,c0:.34,c1:.68,wing:2,R:.35,tw:.26},
{L:4.55,W:1.98,roof:1.12,belt:.78,deck:.86,hood:.66,nose:.42,c0:.38,c1:.70,wing:2,R:.36,tw:.28},
{L:4.70,W:2.02,roof:1.08,belt:.76,deck:.84,hood:.60,nose:.38,c0:.42,c1:.72,wing:3,R:.37,tw:.30}];
const PAINTS=['#e11d1d','#ff7a00','#ffc400','#7ac70c','#00b3a4','#1e63ff','#7b3fe4','#f4f4f4','#aeb4bd','#1a1c20','#ff4fa3','#b9ff2e'];
const CARS=[];
for(let i=0;i<70;i++){const c=Math.floor(i/10),k=i%10,s=CLS[c];
 CARS.push({i,c,k,name:BRANDS[c]+" "+MODELS[k],cls:CLASS_NAMES[c],L:s.L,W:s.W,
  top:36+i*0.42,acc:9+i*0.1,grip:20+i*0.06,turn:2.2,price:i?Math.round(60*Math.pow(i,1.35)/10)*10:0,paint:(i*5)%12});}

/* ---------- tratě ---------- */
const TRACKS=[
['Startovní okruh','summer'],['Zelené údolí','summer'],['Pobřežní sprint','tropic'],['Horský průsmyk','alpine'],
['Pouštní bouře','desert'],['Zimní závod','winter'],['Noční město','night'],['Podzimní les','autumn'],
['Přístavní ulice','dusk'],['Sopečná dráha','volcano'],['Jezerní okruh','summer'],['Starý lom','quarry'],
['Větrná pláň','autumn'],['Neonová dálnice','neon'],['Kaňon','desert'],['Ledová tundra','winter'],
['Palmová pláž','tropic'],['Tovární zóna','dusk'],['Mlžné vrchy','fog'],['Velká cena','summer']
].map((a,t)=>({t,name:a[0],theme:a[1],base:150+t*13,amp:0.8+(t%5)*0.1,aspect:0.8+((t*37)%10)/25,price:t?Math.round(250*Math.pow(t,1.5)):0}));

function catmull(P,n){ // uzavřený Catmull-Rom -> polyline
 const out=[],m=P.length;
 for(let i=0;i<m;i++){const p0=P[(i+m-1)%m],p1=P[i],p2=P[(i+1)%m],p3=P[(i+2)%m];
  for(let s=0;s<n;s++){const t=s/n,t2=t*t,t3=t2*t;
   out.push([0.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
             0.5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]);}}
 return out;}

const trackCache={};
function genTrack(t){
 if(trackCache[t])return trackCache[t];
 const D=TRACKS[t],r=rng(7000+t*977),ks=[2,3,4,5,7];
 const A=[.16,.10,.06,.04,.025].map(v=>v*(0.85+r()*0.3)),ph=ks.map(()=>r()*TAU);
 let amp=D.amp,res=null;
 for(let att=0;att<60;att++){
  const n=28,P=[];
  for(let k=0;k<n;k++){const a=k/n*TAU;let m=0;for(let q=0;q<5;q++)m+=A[q]*Math.sin(ks[q]*a+ph[q]);const rr=D.base*(1+amp*m);P.push([Math.cos(a)*rr*D.aspect,Math.sin(a)*rr]);}
  const poly=catmull(P,40),M=poly.length;
  const cum=[0];for(let i=1;i<=M;i++){const a=poly[i-1],b=poly[i%M];cum.push(cum[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1]));}
  const L=cum[M],N=Math.round(L/2.5),SL=L/N,px=new Float64Array(N),pz=new Float64Array(N);
  let j=0;for(let i=0;i<N;i++){const d=i*SL;while(cum[j+1]<d)j++;const a=poly[j],b=poly[(j+1)%M],u=(d-cum[j])/(cum[j+1]-cum[j]);px[i]=lerp(a[0],b[0],u);pz[i]=lerp(a[1],b[1],u);}
  // křivost
  const k0=new Float64Array(N);
  for(let i=0;i<N;i++){const a=(i+N-1)%N,b=(i+1)%N,x0=px[i]-px[a],z0=pz[i]-pz[a],x1=px[b]-px[i],z1=pz[b]-pz[i];
   k0[i]=Math.abs(Math.atan2(x0*z1-z0*x1,x0*x1+z0*z1))/SL;}
  const kap=new Float64Array(N);let kmax=0;
  for(let i=0;i<N;i++){let s=0;for(let d=-3;d<=3;d++)s+=k0[(i+d+N)%N];kap[i]=s/7;if(kap[i]>kmax)kmax=kap[i];}
  let ok=1/kmax>=34;
  if(ok){const gap=Math.round(N*0.12);
   outer:for(let i=0;i<N;i+=4)for(let j2=i+gap;j2<N;j2+=2){const cd=Math.min(j2-i,N-(j2-i));if(cd<gap)continue;
    if(Math.hypot(px[i]-px[j2],pz[i]-pz[j2])<64){ok=false;break outer;}}}
  if(ok||att===59){res={N,SL,L,px,pz,kap};break;}
  amp*=0.9;}
 // start na nejrovnější části
 const {N,SL,px,pz,kap}=res;let best=1e9,bi=0;
 for(let i=0;i<N;i+=2){let s=0;for(let d=-30;d<=30;d++)s+=kap[(i+d+N)%N];if(s<best){best=s;bi=i;}}
 const sh=a=>{const o=new Float64Array(N);for(let i=0;i<N;i++)o[i]=a[(i+bi)%N];return o};
 const T={t,name:D.name,theme:D.theme,N,SL,L:res.L,px:sh(px),pz:sh(pz),kap:sh(kap),
  tx:new Float64Array(N),tz:new Float64Array(N),nx:new Float64Array(N),nz:new Float64Array(N),
  sx:new Float64Array(N),sz:new Float64Array(N),vprof:new Float64Array(N)};
 for(let i=0;i<N;i++){const a=(i+N-1)%N,b=(i+1)%N;let x=T.px[b]-T.px[a],z=T.pz[b]-T.pz[a];const l=Math.hypot(x,z);x/=l;z/=l;T.tx[i]=x;T.tz[i]=z;T.nx[i]=-z;T.nz[i]=x;

/* ---------- pomůcky ---------- */
const texCache={};
function canvasTex(key,w,h,draw,rx,ry){
 let t=texCache[key];if(t)return t;
 const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
 t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);
 t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());texCache[key]=t;return t;}
function noiseFill(g,w,h,c1,c2,n,a){g.fillStyle=c1;g.fillRect(0,0,w,h);const r=rng(w*7+h);
 for(let i=0;i<n;i++){g.fillStyle=c2;g.globalAlpha=a*(0.3+r()*0.7);const s=1+r()*3;g.fillRect(r()*w,r()*h,s,s);}g.globalAlpha=1;}
function radialTex(key,stops){return canvasTex(key,128,128,(g,w,h)=>{const gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,w,h);});}
function mergeGeos(list){ // list: [[geometry,matrix4|null],...] -> nepřímá geometrie s normálami
 let n=0;const gs=list.map(([g,m])=>{let q=g.index?g.toNonIndexed():g.clone();if(m)q.applyMatrix4(m);n+=q.attributes.position.count;return q;});
 const pos=new Float32Array(n*3),nor=new Float32Array(n*3);let o=0;
 for(const q of gs){pos.set(q.attributes.position.array,o*3);nor.set(q.attributes.normal.array,o*3);o+=q.attributes.position.count;q.dispose();}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));return g;}
function M4(x,y,z,rx,ry,rz,sx,sy,sz){const m=new THREE.Matrix4();m.compose(new THREE.Vector3(x||0,y||0,z||0),new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0,ry||0,rz||0)),new THREE.Vector3(sx||1,sy||1,sz||1));return m;}
function disposeObj(o){o.traverse(x=>{if(x.geometry)x.geometry.dispose();if(x.material){const ms=Array.isArray(x.material)?x.material:[x.material];ms.forEach(m=>{if(m.map&&!Object.values(texCache).includes(m.map))m.map.dispose();m.dispose();});}});}

/* ---------- pásy podél trati ---------- */
function ribbon(T,o0,o1,y,tile,mat){
 const N=T.N,reps=Math.max(1,Math.round(T.L/tile)),pos=new Float32Array((N+1)*6),uv=new Float32Array((N+1)*4),nor=new Float32Array((N+1)*6),idx=[];
 for(let i=0;i<=N;i++){const k=i%N,v=i/N*reps;
  pos.set([T.px[k]+T.nx[k]*o0,y,T.pz[k]+T.nz[k]*o0,T.px[k]+T.nx[k]*o1,y,T.pz[k]+T.nz[k]*o1],i*6);
  uv.set([0,v,1,v],i*4);nor.set([0,1,0,0,1,0],i*6);
  if(i<N){const a=i*2,b=a+2;idx.push(a,a+1,b,a+1,b+1,b);}}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));g.setIndex(idx);
 return new THREE.Mesh(g,mat);}
function wallStrip(T,off,h,tile,mat){
 const N=T.N,reps=Math.max(1,Math.round(T.L/tile)),pos=new Float32Array((N+1)*6),uv=new Float32Array((N+1)*4),nor=new Float32Array((N+1)*6),idx=[],sg=-Math.sign(off);
 for(let i=0;i<=N;i++){const k=i%N,v=i/N*reps,x=T.px[k]+T.nx[k]*off,z=T.pz[k]+T.nz[k]*off;
  pos.set([x,0,z,x,h,z],i*6);uv.set([v,0,v,1],i*4);nor.set([T.nx[k]*sg,0,T.nz[k]*sg,T.nx[k]*sg,0,T.nz[k]*sg],i*6);
  if(i<N){const a=i*2,b=a+2;idx.push(a,a+1,b,a+1,b+1,b);}}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));g.setIndex(idx);
 return new THREE.Mesh(g,mat);}

/* ---------- stromy a kulisy (instancované) ---------- */
function treeGeo(type){
 const L=[],c=(h)=>col(h);
 const add=(g,m,color)=>{const q=g.index?g.toNonIndexed():g;if(m)q.applyMatrix4(m);const n=q.attributes.position.count,cc=new Float32Array(n*3),k=c(color);for(let i=0;i<n;i++){cc[i*3]=k.r;cc[i*3+1]=k.g;cc[i*3+2]=k.b;}q.setAttribute('color',new THREE.BufferAttribute(cc,3));L.push(q);};
 if(type==='pine'){add(new THREE.CylinderGeometry(.22,.32,2,6),M4(0,1,0),'#5a3a22');for(let k=0;k<4;k++)add(new THREE.ConeGeometry(2.0-k*.38,2.6,8),M4(0,2.4+k*1.45,0),'#ffffff');}
 else if(type==='round'){add(new THREE.CylinderGeometry(.25,.36,2.6,6),M4(0,1.3,0),'#5a3a22');add(new THREE.IcosahedronGeometry(2.1,0),M4(0,3.9,0,0,0,0,1,1.05,1),'#ffffff');add(new THREE.IcosahedronGeometry(1.4,0),M4(.9,3.2,.5),'#ffffff');}
 else if(type==='palm'){add(new THREE.CylinderGeometry(.18,.3,6,6),M4(0,3,0,.06,0,.06),'#7a5a3a');for(let k=0;k<7;k++){const a=k/7*TAU;add(new THREE.BoxGeometry(.5,.06,3.4),M4(Math.sin(a)*1.5,6.1,Math.cos(a)*1.5,-.5,a,0),'#ffffff');}}
 else if(type==='cactus'){add(new THREE.CylinderGeometry(.35,.4,3.6,7),M4(0,1.8,0),'#ffffff');add(new THREE.CylinderGeometry(.22,.22,1.4,6),M4(.75,2.2,0,0,0,0),'#ffffff');add(new THREE.CylinderGeometry(.22,.22,.9,6),M4(-.7,1.7,0),'#ffffff');}
 else{add(new THREE.DodecahedronGeometry(1.6,0),M4(0,.7,0,0,0,0,1.3,.8,1),'#ffffff');}
 let n=0;L.forEach(q=>n+=q.attributes.position.count);
 const P=new Float32Array(n*3),N_=new Float32Array(n*3),C=new Float32Array(n*3);let o=0;
 L.forEach(q=>{q.computeVertexNormals?0:0;P.set(q.attributes.position.array,o*3);N_.set(q.attributes.normal.array,o*3);C.set(q.attributes.color.array,o*3);o+=q.attributes.position.count;});
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('normal',new THREE.BufferAttribute(N_,3));g.setAttribute('color',new THREE.BufferAttribute(C,3));return g;}

function scatterTrees(T,th,scene,r){
 const [mnx,mxx,mnz,mxz]=T.bounds,pad=170,loc=TG.newLoc(),groups={};
 th.trees.forEach(([type,color])=>{(groups[type+color]=groups[type+color]||{type,color,pts:[]})});
 const keys=Object.keys(groups);let placed=0;
 for(let tries=0;tries<2600&&placed<th.tn;tries++){
  const x=lerp(mnx-pad,mxx+pad,r()),z=lerp(mnz-pad,mxz+pad,r());
  TG.locate(T,x,z,0,null,loc);if(loc.dist<WALL+8)continue;
  if(loc.dist>140&&r()<0.75)continue;
  const g=groups[keys[Math.floor(r()*keys.length)]];g.pts.push([x,z,r()]);placed++;}
 keys.forEach(k=>{const g=groups[k];if(!g.pts.length)return;
  const geo=treeGeo(g.type),mat=new THREE.MeshLambertMaterial({vertexColors:true,color:col(g.color)});
  const im=new THREE.InstancedMesh(geo,mat,g.pts.length);const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler();
  g.pts.forEach((p,i)=>{const s=g.type==='rock'?0.7+p[2]*2.2:0.8+p[2]*0.9;e.set(0,p[2]*40,0);q.setFromEuler(e);m.compose(new THREE.Vector3(p[0],g.type==='rock'?-0.1:0,p[1]),q,new THREE.Vector3(s,s*(0.9+p[2]*0.3),s));im.setMatrixAt(i,m);});
  im.instanceMatrix.needsUpdate=true;im.frustumCulled=false;scene.add(im);});}

function loft(st,M){
 const K=st.length,pos=[],idx=[];
 for(let k=0;k<K;k++){const s=st[k],cy=(s.y0+s.y1)/2,ry=(s.y1-s.y0)/2,e=2/s.n;
  for(let j=0;j<M;j++){const a=j/M*TAU,c=Math.cos(a),sn=Math.sin(a);pos.push(Math.sign(c)*Math.pow(Math.abs(c),e)*s.hw,cy+Math.sign(sn)*Math.pow(Math.abs(sn)*1,e)*ry,s.z);}}
 const c0=pos.length/3;pos.push(0,(st[0].y0+st[0].y1)/2,st[0].z);const c1=c0+1;pos.push(0,(st[K-1].y0+st[K-1].y1)/2,st[K-1].z);
 for(let k=0;k<K-1;k++)for(let j=0;j<M;j++){const a=k*M+j,b=k*M+(j+1)%M,c=(k+1)*M+j,d=(k+1)*M+(j+1)%M;idx.push(a,b,c,b,d,c);}
 for(let j=0;j<M;j++){idx.push(c0,(j+1)%M,j);const o=(K-1)*M;idx.push(c1,o+j,o+(j+1)%M);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));g.setIndex(idx);g.computeVertexNormals();return g;}
function keyI(keys,t){if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++)if(t<=keys[i][0]){const a=keys[i-1],b=keys[i],u=(t-a[0])/(b[0]-a[0]),s=u*u*(3-2*u);return a[1]+(b[1]-a[1])*s;}return keys[keys.length-1][1];}

function updateCarVisual(g,x,z,h,speed,steer,braking,dt,roll){

function makeEffects(scene){

 const pool=[],sparks=[];
 for(let i=0;i<48;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,transparent:true,depthWrite:false,opacity:0,color:0xdddddd}));s.visible=false;scene.add(s);pool.push({s,life:0,max:1,vx:0,vy:0,vz:0,g:1});}

 let pi=0,si=0;
 // stopy
 const MAXS=1600,sp=new Float32Array(MAXS*12),idx=new Uint16Array(MAXS*6);for(let i=0;i<MAXS;i++){const a=i*4;idx.set([a,a+1,a+2,a+1,a+3,a+2],i*6);}
 const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));sg.setIndex(new THREE.BufferAttribute(idx,1));sg.setDrawRange(0,0);
 const skid=new THREE.Mesh(sg,new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.5,depthWrite:false,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));skid.frustumCulled=false;skid.renderOrder=1;scene.add(skid);
 let sc=0,sn=0;const last=[null,null];
 return{
  smoke(x,y,z,color,size){const p=pool[pi++%pool.length];p.s.visible=true;p.s.position.set(x,y,z);p.life=p.max=0.7+Math.random()*0.5;p.vx=(Math.random()-.5)*1.2;p.vz=(Math.random()-.5)*1.2;p.vy=0.8+Math.random();p.s.material.color.setHex(color||0xdddddd);p.size=size||2;p.s.scale.set(p.size*.6,p.size*.6,1);},
  spark(x,y,z,vx,vz){const p=sparks[si++%sparks.length];p.s.visible=true;p.s.position.set(x,y,z);p.life=p.max=0.3+Math.random()*0.25;p.vx=vx+(Math.random()-.5)*6;p.vz=vz+(Math.random()-.5)*6;p.vy=2+Math.random()*4;p.s.scale.set(.5,.5,1);},
  skidAt(k,x,z,nx,nz,on){ // k = 0/1 kolo
   if(!on){last[k]=null;return;}const l=last[k];last[k]=[x,z,nx,nz];if(!l)return;
   if(Math.hypot(x-l[0],z-l[1])<0.15)return;const w=.14,o=(sc%MAXS)*12;
   sp.set([l[0]-l[2]*w,.05,l[1]-l[3]*w,l[0]+l[2]*w,.05,l[1]+l[3]*w,x-nx*w,.05,z-nz*w,x+nx*w,.05,z+nz*w],o);sc++;sn=Math.min(MAXS,sn+1);
   sg.setDrawRange(0,sn*6);sg.attributes.position.needsUpdate=true;},
  update(dt){for(const p of pool){if(p.life<=0)continue;p.life-=dt;if(p.life<=0){p.s.visible=false;continue;}const t=1-p.life/p.max;p.s.position.x+=p.vx*dt;p.s.position.z+=p.vz*dt;p.s.position.y+=p.vy*dt*(1-t);p.s.material.opacity=0.5*(1-t);const s=p.size*(0.6+t*1.6);p.s.scale.set(s,s,1);}
   for(const p of sparks){if(p.life<=0)continue;p.life-=dt;if(p.life<=0){p.s.visible=false;continue;}p.vy-=14*dt;p.s.position.x+=p.vx*dt;p.s.position.z+=p.vz*dt;p.s.position.y=Math.max(0.05,p.s.position.y+p.vy*dt);p.s.material.opacity=p.life/p.max;}}};}

(function(){

 else{s=localStorage.getItem('turbogarage1');if(s){const o=JSON.parse(s);S.coins=o.coins||0;S.cars=o.cars||[0];S.tracks=o.tracks||[0];S.car=o.car||0;S.track=o.track||0;}}}catch(e){}

/* ---------- zvuk ---------- */
const SFX=(()=>{let ctx=null,master,o1,o2,lp,eg,sk,sg,wg,nb;
 function init(){if(ctx)return;try{ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=S.snd?0.55:0;master.connect(ctx.destination);
  o1=ctx.createOscillator();o1.type='sawtooth';o2=ctx.createOscillator();o2.type='square';lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=3;eg=ctx.createGain();eg.gain.value=0;
  const g2=ctx.createGain();g2.gain.value=0.45;o1.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(eg);eg.connect(master);o1.start();o2.start();
  const len=ctx.sampleRate*2;nb=ctx.createBuffer(1,len,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const ns=ctx.createBufferSource();ns.buffer=nb;ns.loop=true;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1700;bp.Q.value=2.5;sg=ctx.createGain();sg.gain.value=0;ns.connect(bp);bp.connect(sg);sg.connect(master);ns.start();
  const ns2=ctx.createBufferSource();ns2.buffer=nb;ns2.loop=true;const lp2=ctx.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=600;wg=ctx.createGain();wg.gain.value=0;ns2.connect(lp2);lp2.connect(wg);wg.connect(master);ns2.start();
 }catch(e){ctx=null}}
 const ok=()=>ctx&&ctx.state!=='closed';
 return{init,resume(){if(ok()&&ctx.state==='suspended')ctx.resume()},
  mute(m){S.snd=m?0:1;if(ok())master.gain.setTargetAtTime(m?0:0.55,ctx.currentTime,0.05)},
  engine(rpm,thr,speed,skid,on){if(!ok())return;const t=ctx.currentTime;
   if(!on){eg.gain.setTargetAtTime(0,t,0.05);sg.gain.setTargetAtTime(0,t,0.05);wg.gain.setTargetAtTime(0,t,0.05);return;}
   const f=48+rpm*190;o1.frequency.setTargetAtTime(f,t,0.04);o2.frequency.setTargetAtTime(f*0.5,t,0.04);
   lp.frequency.setTargetAtTime(380+rpm*900+thr*1500,t,0.05);eg.gain.setTargetAtTime(0.09+thr*0.1+rpm*0.05,t,0.05);
   sg.gain.setTargetAtTime(Math.min(0.28,skid*0.28),t,0.04);wg.gain.setTargetAtTime(Math.min(0.22,speed*0.22),t,0.1);},
  beep(f,d,v){if(!ok())return;const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(v||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02)},
  thump(v){if(!ok())return;const t=ctx.currentTime,s=ctx.createBufferSource();s.buffer=nb;const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=260+v*30;const g=ctx.createGain();g.gain.setValueAtTime(Math.min(1,0.25+v*0.05),t);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random(),0.4)}};})();

/* ---------- vstup ---------- */
const keys={},touch={};
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'g',KeyW:'g',ArrowDown:'b',KeyS:'b',Space:'h',ShiftLeft:'n',ShiftRight:'n',KeyN:'n'};
addEventListener('keydown',e=>{
 if(KM[e.code]){keys[KM[e.code]]=1;e.preventDefault();return}
 if(e.code==='KeyC'&&mode==='race')cycleCam();else if(e.code==='KeyR'&&mode==='race')doReset();
 else if((e.code==='Escape'||e.code==='KeyP')&&mode==='race')togglePause();else if(e.code==='KeyM')toggleSound();});
addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=0});
for(const[id,k]of[['bL','l'],['bR','r'],['bG','g'],['bB','b'],['bN','n']]){const b=$(id);
 b.addEventListener('pointerdown',e=>{touch[k]=1;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault();SFX.init();SFX.resume();});
 for(const ev of['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{touch[k]=0;b.classList.remove('on')});}
addEventListener('contextmenu',e=>e.preventDefault());
const inp={st:0,thr:0,brk:0,hb:0,nitro:0};
function readInput(){
 let st=(keys.r||touch.r?1:0)-(keys.l||touch.l?1:0),thr=(keys.g||touch.g)?1:0,brk=(keys.b||touch.b)?1:0,hb=keys.h?1:0,nit=(keys.n||touch.n)?1:0;
 try{const gp=(navigator.getGamepads&&navigator.getGamepads()[0]);if(gp){const ax=gp.axes[0]||0;if(Math.abs(ax)>0.12)st=ax;thr=Math.max(thr,gp.buttons[7]?gp.buttons[7].value:0);brk=Math.max(brk,gp.buttons[6]?gp.buttons[6].value:0);if(gp.buttons[0]&&gp.buttons[0].pressed)nit=1;if(gp.buttons[2]&&gp.buttons[2].pressed)hb=1;}}catch(e){}
 if(S.auto&&!brk&&!thr)thr=1;
 inp.st=st;inp.thr=thr;inp.brk=brk;inp.hb=hb;inp.nitro=nit;return inp;}

let mode='menu',tab='cars',G=null,gcam=new THREE.PerspectiveCamera(30,1,0.1,100),gAuto=0,dragX=null;
function trackSvg(t){const T=TG.genTrack(t),b=T.bounds,w=b[1]-b[0],h=b[3]-b[2],sc=Math.min(92/w,44/h),ox=50-(b[0]+w/2)*sc,oz=27-(b[2]+h/2)*sc;let d='';
 for(let i=0;i<T.N;i+=Math.max(1,Math.round(T.N/70)))d+=(i?'L':'M')+(T.px[i]*sc+ox).toFixed(1)+' '+(T.pz[i]*sc+oz).toFixed(1);
 return'<svg viewBox="0 0 100 54"><path d="'+d+'Z" fill="none" stroke="#fff3" stroke-width="7" stroke-linejoin="round"/><path d="'+d+'Z" fill="none" stroke="#ffb300" stroke-width="2.6" stroke-linejoin="round"/></svg>';}
function stats(c){const n=(v,a,b)=>Math.round(18+82*TG.clamp((v-a)/(b-a),0,1));
 return[['Rychlost',n(c.top,36,65)],['Zrychlení',n(c.acc,9,16)],['Přilnavost',n(c.grip,20,24.2)]].map(s=>'<div class="st"><span>'+s[0]+'</span><i><b style="width:'+s[1]+'%"></b></i></div>').join('');}
function renderMenu(){
 $('coins').textContent='🪙 '+fmtC(S.coins);
 const c=TG.CARS[S.car];$('pName').textContent=c.name;$('pCls').textContent=c.cls+' · '+Math.round(c.top*3.6)+' km/h';$('pStats').innerHTML=stats(c);

 const L=$('list'),keep=L.scrollTop;
 if(tab==='cars'){L.innerHTML='<div class="grid">'+TG.CARS.map(c=>{const own=S.cars.includes(c.i);
  return'<div class="card'+(S.car===c.i?' sel':'')+(own?'':' lock')+'" data-car="'+c.i+'"><span class="dot" style="background:'+TG.PAINTS[paintOf(c.i)]+'"></span><b>'+c.name+'</b><small>'+c.cls+' · '+Math.round(c.top*3.6)+' km/h</small><div class="pr">'+(own?(S.car===c.i?'✔ vybráno':'vlastníš'):'🔒 '+fmtC(c.price))+'</div></div>'}).join('')+'</div>';}
 else if(tab==='tracks'){L.innerHTML='<div class="grid">'+TG.TRACKS.map(t=>{const own=S.tracks.includes(t.t),b=S.best[t.t];
  return'<div class="card'+(S.track===t.t?' sel':'')+(own?'':' lock')+'" data-trk="'+t.t+'">'+trackSvg(t.t)+'<b>'+(t.t+1)+'. '+t.name+'</b><small>'+(b?'Rekord '+fmtT(b):'bez rekordu')+'</small><div class="pr">'+(own?(S.track===t.t?'✔ vybráno':'odemčeno'):'🔒 '+fmtC(t.price))+'</div></div>'}).join('')+'</div>';}
 else{L.innerHTML='<div class="opt">Zvuk<div class="tog'+(S.snd?' on':'')+'" data-o="snd"></div></div><div class="opt">Automatický plyn<div class="tog'+(S.auto?' on':'')+'" data-o="auto"></div></div>'+
  '<div class="opt" style="color:#9fb3d1;font-weight:500;font-size:13px;line-height:1.4">Ovládání: šipky / WASD, mezerník = ruční brzda (drift), Shift = nitro, C = kamera, R = vrátit na trať, Esc = pauza. Nitro se plní driftem.</div>'+
  '<div class="opt" style="justify-content:center"><button class="rbtn" data-o="reset" style="background:#5a1c1c">Smazat postup</button></div>';}
 L.scrollTop=keep;}
function setGarageCar(){if(!G)return;if(G.car){G.turn.remove(G.car);disposeObj(G.car);}const c=TG.CARS[S.car];G.car=buildCar(c,paintOf(S.car));G.car.userData.shadow.visible=false;G.turn.add(G.car);}
$('menu').addEventListener('click',e=>{
 const sw=e.target.closest('.sw');if(sw){S.paint[S.car]=+sw.dataset.p;save();renderMenu();setGarageCar();return}
 const tb=e.target.closest('#tabs button');if(tb){tab=tb.dataset.t;$('list').scrollTop=0;renderMenu();return}
 const c=e.target.closest('.card');
 if(c&&c.dataset.car!==undefined){const x=TG.CARS[+c.dataset.car];
  if(!S.cars.includes(x.i)){if(S.coins<x.price)return toast('Chybí ti '+fmtC(x.price-S.coins)+' 🪙 – vyhraj závod!');S.coins-=x.price;S.cars.push(x.i);}
  S.car=x.i;save();renderMenu();setGarageCar();return}
 if(c&&c.dataset.trk!==undefined){const x=TG.TRACKS[+c.dataset.trk];
  if(!S.tracks.includes(x.t)){if(S.coins<x.price)return toast('Chybí ti '+fmtC(x.price-S.coins)+' 🪙 – vyhraj závod!');S.coins-=x.price;S.tracks.push(x.t);}
  S.track=x.t;save();renderMenu();return}
 const o=e.target.closest('[data-o]');
 if(o){const k=o.dataset.o;if(k==='snd')toggleSound();else if(k==='auto'){S.auto=S.auto?0:1;save();renderMenu();}
  else if(k==='reset'&&confirm('Opravdu smazat všechny peníze a odemčená auta i okruhy?')){S={coins:0,cars:[0],tracks:[0],car:0,track:0,laps:3,paint:{},snd:S.snd,auto:S.auto,best:{}};save();renderMenu();setGarageCar();}}});
$('lapM').onclick=()=>{S.laps=Math.max(1,S.laps-1);save();renderMenu()};$('lapP').onclick=()=>{S.laps=Math.min(10,S.laps+1);save();renderMenu()};
const pv=$('preview');pv.addEventListener('pointerdown',e=>{if(e.target.closest('.sw'))return;dragX=e.clientX;gAuto=3;try{pv.setPointerCapture(e.pointerId)}catch(_){}});
pv.addEventListener('pointermove',e=>{if(dragX!=null&&G){G.turn.rotation.y+=(e.clientX-dragX)*0.012;dragX=e.clientX;gAuto=3;}});
for(const ev of['pointerup','pointercancel'])pv.addEventListener(ev,()=>{dragX=null});
function toggleSound(){S.snd=S.snd?0:1;SFX.mute(!S.snd);save();$('bSnd').style.opacity=S.snd?1:.45;if(mode==='menu')renderMenu();}
function showMenu(){mode='menu';document.body.classList.remove('racing');$('menu').classList.add('on');$('hud').style.display='none';$('speedfx').style.opacity=0;
 ['pause','result','loading'].forEach(i=>$(i).classList.remove('on'));SFX.engine(0,0,0,0,false);
 if(world){disposeObj(world.scene);world=null;}
 if(!G){G=buildGarage();}setGarageCar();renderMenu();resize();}
function garageFrame(dt){
 const W=innerWidth,H=innerHeight,r=pv.getBoundingClientRect();
 renderer.setScissorTest(false);renderer.setViewport(0,0,W,H);renderer.clear();
 if(r.width<10||r.height<10)return;
 if(gAuto>0)gAuto-=dt;else G.turn.rotation.y+=dt*0.55;
 renderer.setScissorTest(true);renderer.setViewport(r.left,H-r.bottom,r.width,r.height);renderer.setScissor(r.left,H-r.bottom,r.width,r.height);
 gcam.aspect=r.width/r.height;const d=gcam.aspect<1.3?9.5:7.6;gcam.fov=gcam.aspect<1?42:32;gcam.updateProjectionMatrix();gcam.position.set(0,1.9*(d/8),d);gcam.lookAt(0,0.55,0);

/* ---------- závod ---------- */
let R=null,world=null,fx=null,pm=null,aim=[],paused=false,mini=null,lastMsg=0,hudT=0,cam={h:0,mode:0,shake:0,fov:62,roll:0},prevState='',resultT=0,lastLight=4,goT=0,smT=0,sndHit=0;
const camModes=[{d:7.4,h:2.8,la:8},{d:11.5,h:4.6,la:10},{d:0,h:1.2,la:22}];
function startRace(){
 SFX.init();SFX.resume();$('loading').classList.add('on');$('menu').classList.remove('on');
 setTimeout(()=>{try{buildRace()}catch(e){toast('Chyba při načtení: '+e.message);showMenu();}},40);}
function buildRace(){
 if(world){disposeObj(world.scene);world=null;}
 const T=TG.genTrack(S.track),car=TG.CARS[S.car];
 R=TG.newRace(S.track,S.car,S.laps);world=buildWorld(T);fx=makeEffects(world.scene);
 pm=buildCar(car,paintOf(S.car),{beam:!!world.th.night});world.scene.add(pm);
 aim=R.ai.map((a,i)=>{const m=buildCar(a.car,(paintOf(S.car)+3+i*2)%12,{beam:!!world.th.night});world.scene.add(m);return m});
 // minimapa
 const mc=document.createElement('canvas');mc.width=mc.height=232;const g=mc.getContext('2d'),b=T.bounds,w=b[1]-b[0],h=b[3]-b[2],sc=Math.min(200/w,200/h),ox=116-(b[0]+w/2)*sc,oz=116-(b[2]+h/2)*sc;
 const path=()=>{g.beginPath();for(let i=0;i<T.N;i+=3){const x=T.px[i]*sc+ox,y=T.pz[i]*sc+oz;i?g.lineTo(x,y):g.moveTo(x,y);}g.closePath();};
 g.lineJoin='round';g.lineCap='round';g.strokeStyle='#000a';g.lineWidth=12;path();g.stroke();g.strokeStyle='#cfd6e0';g.lineWidth=7;path();g.stroke();
 g.fillStyle='#fff';g.fillRect(T.px[0]*sc+ox-6,T.pz[0]*sc+oz-2,12,4);
 mini={img:mc,sc,ox,oz};
 paused=false;prevState='count';lastLight=4;goT=0;resultT=0;cam.mode=0;cam.shake=0;cam.h=R.P.h;
 const P=R.P,f=camModes[0];camera.position.set(P.x-Math.sin(P.h)*f.d,f.h,P.z-Math.cos(P.h)*f.d);
 mode='race';document.body.classList.add('racing');$('hud').style.display='block';$('hSpeed').style.display='';
 $('loading').classList.remove('on');$('big').textContent='';$('lights').style.display='flex';$('bSnd').style.opacity=S.snd?1:.45;
 lastT=performance.now();resize();}
function cycleCam(){cam.mode=(cam.mode+1)%3;}
function doReset(){if(R&&R.state==='race'){const P=R.P;TG.resetPlayer(P,R.T);cam.h=P.h;}}
function togglePause(){if(mode!=='race'||!R||R.state==='done')return;paused=!paused;$('pause').classList.toggle('on',paused);if(paused)SFX.engine(0,0,0,0,false);lastT=performance.now();}
$('bPause').onclick=togglePause;$('bCam').onclick=cycleCam;$('bSnd').onclick=toggleSound;$('bReset').onclick=doReset;
$('pResume').onclick=togglePause;$('pRestart').onclick=()=>{$('pause').classList.remove('on');startRace()};$('pGarage').onclick=showMenu;
$('rAgain').onclick=startRace;$('rGarage').onclick=showMenu;$('go').onclick=startRace;

function finishScreen(){
 const T=R.T,P=R.P,N=T.N,rank=R.finishRank;
 const rows=R.ai.map(a=>({n:a.name+' · '+a.car.name,fin:a.fin,prog:a.cross*N+a.s,me:false}));rows.push({n:'TY · '+R.car.name,fin:P.fin,prog:P.cross*N+P.loc.s,me:true});
 rows.sort((a,b)=>(a.fin!=null&&b.fin!=null)?a.fin-b.fin:a.fin!=null?-1:b.fin!=null?1:b.prog-a.prog);
 const rec=S.best[T.t];let newRec=false;if(P.bestLap<1e8){if(!rec)S.best[T.t]=P.bestLap;else if(P.bestLap<rec){S.best[T.t]=P.bestLap;newRec=true;}}
 const earn=TG.reward(rank,T.t,newRec);S.coins+=earn;save();
 $('rTitle').textContent=rank===1?'🏆 VÍTĚZSTVÍ!':rank<=3?'🥈 Stupně vítězů':'Dojel jsi '+rank+'.';
 $('resList').innerHTML=rows.map((r,i)=>'<div class="'+(r.me?'me':'')+'"><span>'+(i+1)+'. '+r.n+'</span><span>'+(r.fin!=null?fmtT(r.fin):'—')+'</span></div>').join('')+'<div><span>Nejlepší kolo</span><span>'+fmtT(P.bestLap)+(newRec?' ★ nový rekord':'')+'</span></div>';
 $('rwd').textContent='+ '+fmtC(earn)+' 🪙'+(newRec?'  (vč. bonusu za rekord)':'');
 $('result').classList.add('on');}

let lastT=performance.now(),frames=0,ftAcc=0,pr=Math.min(devicePixelRatio||1,2),prMax=pr;
function resize(){const W=innerWidth,H=innerHeight;renderer.setPixelRatio(pr);renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));

function simulate(dt){
 const n=Math.max(1,Math.ceil(dt/(1/90))),h=dt/n,I=readInput();let imp=0,hit=0;
 for(let k=0;k<n;k++){TG.stepRace(R,h,I);if(R.P.impact>imp)imp=R.P.impact;if(R.hitFx>hit)hit=R.hitFx;}
 return{imp,hit};}
function frameRace(dt){
 const P=R.P,car=R.car,T=R.T;let ev={imp:0,hit:0};
 if(!paused)ev=simulate(dt);
 // stavy
 if(R.state!==prevState){if(R.state==='race'){showGo();}prevState=R.state;}
 if(R.state==='count'){const c=R.count,L=document.querySelectorAll('#lights i'),lit=c<=0?3:c<1?3:c<2?2:c<3?1:0;
  L.forEach((el,i)=>{el.className=i<lit?(c<=0.05?'g':'r'):''});const key=Math.ceil(c);if(key!==lastLight&&key<=3&&key>=1){lastLight=key;SFX.beep(440,0.18,0.25);}}
 if(R.state==='done'){resultT+=dt;if(resultT>1.6&&!$('result').classList.contains('on')&&!R.shown){R.shown=true;finishScreen();}}
 if(R.msg){const m=R.msg;R.msg=null;if(m.k==='lap'){showMsg('KOLO '+(P.cross-1)+' · '+fmtT(m.t));SFX.beep(880,0.12,0.2);}}
 if(goT>0){goT-=dt;if(goT<=0){$('big').textContent='';$('lights').style.display='none';}}
 // vizuály
 const sp=P.speed,fr=TG.clamp(sp/(car.top*1.2),0,1),braking=(inp.brk>0&&P.vF>1)||R.state==='count';
 updateCarVisual(pm,P.x,P.z,P.h,P.vF,P.steer,braking,dt,-P.steer*0.025*Math.min(1,sp/25));
 R.ai.forEach((a,i)=>updateCarVisual(aim[i],a.x,a.z,a.h,a.v,0,false,dt,0));
 // efekty
 if(!paused&&R.state!=='count'){
  const sh=Math.sin(P.h),ch=Math.cos(P.h),rx=-ch,rz=sh,bx=P.x-sh*car.L*0.34,bz=P.z-ch*car.L*0.34,w=car.W*0.42;
  const slide=(P.slip>3.4&&sp>7)||(inp.hb&&sp>8)||(inp.brk&&sp>22&&P.vF>0);
  fx.skidAt(0,bx+rx*w,bz+rz*w,rx,rz,slide&&P.surf<2);fx.skidAt(1,bx-rx*w,bz-rz*w,rx,rz,slide&&P.surf<2);
  smT-=dt;if(smT<=0&&sp>6){if(slide&&P.surf<2){smT=0.03;fx.smoke(bx+rx*w,0.3,bz+rz*w,0xeeeeee,2.2);fx.smoke(bx-rx*w,0.3,bz-rz*w,0xeeeeee,2.2);}
   else if(P.surf===2){smT=0.04;fx.smoke(bx+rx*w,0.3,bz+rz*w,0xb59a70,2.6);fx.smoke(bx-rx*w,0.3,bz-rz*w,0xb59a70,2.6);}}
  if(ev.imp>2.5){for(let q=0;q<5;q++)fx.spark(P.x+(Math.random()-.5)*2,0.5,P.z+(Math.random()-.5)*2,P.vx*0.2,P.vz*0.2);}
  if(ev.imp>3&&sndHit<=0){SFX.thump(ev.imp);sndHit=0.2;cam.shake=Math.min(1,cam.shake+ev.imp*0.05);}
  if(ev.hit>2&&sndHit<=0){SFX.thump(ev.hit*0.7);sndHit=0.2;cam.shake=Math.min(1,cam.shake+ev.hit*0.04);}
  sndHit-=dt;
  if(P.surf>=1)cam.shake=Math.max(cam.shake,P.surf===2?0.18:0.07);
  if(inp.nitro&&P.nitro>0.02&&sp>5&&Math.random()<0.5)fx.spark(bx,0.45,bz,-sh*8,-ch*8);}
 fx.update(dt);
 // zvuk
 let gear=Math.min(5,Math.floor(fr*6)),rp=fr*6-gear;rp=0.22+0.78*rp;if(sp<1)rp=0.18+inp.thr*0.5;
 SFX.engine(rp,inp.thr,fr,(P.slip>3.4&&sp>7&&P.surf<2)||(inp.hb&&sp>8)?Math.min(1,P.slip/8):(P.surf===2&&sp>8?0.3:0),R.state!=='done'&&!paused);
 // kamera
 updateCamera(dt,fr);
 world.update(dt,camera,R.time);
 // HUD
 hudT-=dt;if(hudT<=0){hudT=1/20;updateHud(gear,rp,fr);}
 $('speedfx').style.opacity=Math.min(1,Math.max(0,(fr-0.55)*1.2)+(inp.nitro&&P.nitro>0.02?0.5:0));}
function showGo(){$('big').textContent='GO!';goT=0.9;SFX.beep(880,0.4,0.28);const L=document.querySelectorAll('#lights i');L.forEach(el=>el.className='g');}
function updateCamera(dt,fr){
 const P=R.P,car=R.car,sp=P.speed,m=camModes[cam.mode];
 let tgt=P.h;if(sp>8&&P.vF>0){const vh=Math.atan2(P.vx,P.vz);tgt=P.h+TG.clamp(TG.wrapPI(vh-P.h),-0.6,0.6)*0.55;}
 if(cam.mode===2)cam.h=P.h;else cam.h+=TG.wrapPI(tgt-cam.h)*(1-Math.exp(-6*dt));
 const fx_=Math.sin(cam.h),fz=Math.cos(cam.h);let tx,ty,tz,k;
 if(cam.mode===2){const sh=Math.sin(P.h),ch=Math.cos(P.h);tx=P.x+sh*(car.L*0.5+0.15);tz=P.z+ch*(car.L*0.5+0.15);ty=0.78;k=1-Math.exp(-40*dt);}
 else{const d=m.d+sp*0.018;tx=P.x-fx_*d;tz=P.z-fz*d;ty=m.h+sp*0.01;k=1-Math.exp(-12*dt);}
 camera.position.x+=(tx-camera.position.x)*k;camera.position.y+=(ty-camera.position.y)*k;camera.position.z+=(tz-camera.position.z)*k;
 cam.shake*=Math.exp(-5*dt);const sh2=cam.shake*0.25;
 camera.position.x+=(Math.random()-.5)*sh2;camera.position.y+=(Math.random()-.5)*sh2*0.6;
 const la=m.la,lx=P.x+Math.sin(cam.mode===2?P.h:cam.h)*la,lz=P.z+Math.cos(cam.mode===2?P.h:cam.h)*la;
 camera.lookAt(lx,cam.mode===2?1.0:1.0,lz);
 camera.rotateZ(-P.steer*0.02*Math.min(1,sp/30)+(Math.random()-.5)*sh2*0.02);
 const asp=camera.aspect,base=(asp<1?62*(1+(1-asp)*0.5):62),nit=(inp.nitro&&P.nitro>0.02)?8:0,fov=base+fr*14+nit;
 if(Math.abs(fov-cam.fov)>0.05){cam.fov+=(fov-cam.fov)*Math.min(1,6*dt);camera.fov=cam.fov;camera.updateProjectionMatrix();}
 pm.visible=cam.mode!==2;}
function updateHud(gear,rp,fr){
 const P=R.P,T=R.T,N=T.N;
 let rank=TG.rankOf(R);if(R.state==='done')rank=R.finishRank;
 $('hPos').innerHTML=rank+'<small>/6</small>';
 $('hLap').textContent='KOLO '+Math.min(R.laps,Math.max(1,P.cross))+'/'+R.laps;
 $('hTime').textContent=fmtT(Math.max(0,R.time));
 $('hBest').textContent=P.bestLap<1e8?'NEJ '+fmtT(P.bestLap):(S.best[T.t]?'REKORD '+fmtT(S.best[T.t]):'');
 $('spd').textContent=Math.round(P.speed*3.6);
 $('gear').textContent=P.vF<-0.5?'R':P.speed<1?'N':(gear+1);
 $('rpm').firstChild.style.width=Math.round(rp*100)+'%';$('nit').firstChild.style.width=Math.round(P.nitro*100)+'%';
 $('wrong').style.display=P.wrong>1.2?'block':'none';
 // minimapa
 const g=$('mini').getContext('2d');g.clearRect(0,0,232,232);g.drawImage(mini.img,0,0);
 const dot=(x,z,r,c)=>{g.beginPath();g.arc(x*mini.sc+mini.ox,z*mini.sc+mini.oz,r,0,6.3);g.fillStyle=c;g.fill();};
 R.ai.forEach(a=>dot(a.x,a.z,5,'#ff5a5a'));dot(P.x,P.z,7,'#ffb300');g.lineWidth=2;g.strokeStyle='#000';g.stroke();}

function frame(now){
 requestAnimationFrame(frame);
 let dt=Math.min(0.05,Math.max(0.0005,(now-lastT)/1000));lastT=now;
 try{
  if(mode==='menu'&&G)garageFrame(dt);
  else if(mode==='race'&&R&&world){frameRace(paused?0:dt);renderer.setScissorTest(false);renderer.setViewport(0,0,innerWidth,innerHeight);renderer.render(world.scene,camera);}
 }catch(e){toast('Chyba: '+e.message);mode='err';setTimeout(()=>{try{showMenu()}catch(_){}},2500);}
 // automatická kvalita
 frames++;ftAcc+=dt;if(frames>=90){const avg=ftAcc/frames;if(avg>1/38&&pr>0.8){pr=Math.max(0.8,pr-0.25);resize();}else if(avg<1/57&&pr<prMax){pr=Math.min(prMax,pr+0.25);resize();}frames=0;ftAcc=0;}}

window.__tg={TG,get R(){return R},get S(){return S},start:(t,c,l)=>{S.track=t;S.car=c;S.laps=l||3;startRace()},get world(){return world},menu:showMenu,step:(s)=>{for(let i=0;i<s*60;i++)TG.stepRace(R,1/60,null)}};
showMenu();requestAnimationFrame(frame);
})();

</script>
